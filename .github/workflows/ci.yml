name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (build, unit, smoke)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Pinned to the PoB revision the oracle golden was generated from.
      POB_REF: 16de4b82d57f1c0de6eb40f37143c32d4da36a02
      POB_TIMEOUT_MS: '60000'
      POB_LUA_ENABLED: 'true'
    steps:
      - name: Check out pob-mcp
        uses: actions/checkout@v4

      - name: Check out Path of Building at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: 16de4b82d57f1c0de6eb40f37143c32d4da36a02
          path: .pob/PathOfBuilding
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --ci --maxWorkers=2

      - name: Smoke tests
        shell: pwsh
        env:
          POB_PATH: ${{ github.workspace }}\.pob\PathOfBuilding\src
          POB_LUA_DLL: ${{ github.workspace }}\.pob\PathOfBuilding\runtime\lua51.dll
          POB_CMD: python
          POB_ARGS: ${{ github.workspace }}\tools\pob_luajit.py ${{ github.workspace }}\lua\vanilla_stdio_bridge.lua
        run: |
          node tests/smoke/bridge.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/smoke/mcp.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/smoke/mcp-full.mjs

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          "PoB revision: $env:POB_REF" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Node: $(node --version)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Python: $(python --version 2>&1)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
